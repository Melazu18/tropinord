<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme color for both modes -->
    <meta
      name="theme-color"
      content="#166534"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1b13"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Basic SEO -->
    <title>TropiNord</title>
    <link rel="canonical" href="https://www.tropinord.com/" />

    <!-- Hreflang alternates (adjust paths to match your live slugs) -->
    <link
      rel="alternate"
      href="https://www.tropinord.com/en/home"
      hreflang="en"
    />
    <link
      rel="alternate"
      href="https://www.tropinord.com/sv/hem"
      hreflang="sv"
    />
    <link
      rel="alternate"
      href="https://www.tropinord.com/fr/accueil"
      hreflang="fr"
    />
    <link
      rel="alternate"
      href="https://www.tropinord.com/es/inicio"
      hreflang="es"
    />
    <link
      rel="alternate"
      href="https://www.tropinord.com/"
      hreflang="x-default"
    />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TropiNord" />
    <meta property="og:title" content="TropiNord – Naturally Rooted Wellness" />
    <meta
      property="og:description"
      content="Explore ethical, tropical products for beauty and balance, from the tropics to the Nordics."
    />
    <meta property="og:url" content="https://www.tropinord.com/" />
    <meta
      property="og:image"
      content="https://www.tropinord.com/images/share/default-share.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tropinord" />
    <meta
      name="twitter:title"
      content="TropiNord – Naturally Rooted Wellness"
    />
    <meta
      name="twitter:description"
      content="Explore ethical, tropical products for beauty and balance."
    />
    <meta
      name="twitter:image"
      content="https://www.tropinord.com/images/share/default-share.jpg"
    />

    <!-- Favicons (optional)
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    -->

    <!-- EARLY LANG/RTL BOOTSTRAP
         Make <html lang> follow the first URL segment (/en|sv|fr|es)
         before React mounts. This avoids mismatches and flashes. -->
    <script>
      (function () {
        var m = location.pathname.match(/^\/(en|sv|fr|es)(?=\/|$)/);
        var lng = (m && m[1]) || "en";
        var rtl = ["ar", "he", "fa", "ur"].indexOf(lng) !== -1;
        var html = document.documentElement;
        html.lang = lng;
        html.dir = rtl ? "rtl" : "ltr";
        // Keep a single language hint; i18n will still be the source of truth.
        try {
          localStorage.setItem("lang", lng);
        } catch (_) {}
      })();
    </script>

    <!-- NOTE:
      We do NOT include the reCAPTCHA script here.
      Your src/utils/recaptcha.js should dynamically load:
      https://www.google.com/recaptcha/api.js?render=<SITE_KEY>
    -->
  </head>

  <body>
    <noscript>
      <style>
        body {
          font-size: 16px;
          padding: 1rem;
        }
      </style>
      JavaScript is required to run this app.
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Zoho Newsletter Popup (kept, fully deferred & throttled) -->
    <style>
      .zf_lB_Dimmer_172856 {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0.8;
        z-index: 10000000;
      }
      .zf_lB_Container_172856 {
        position: fixed;
        background: #fff;
        margin: 0;
        padding: 0;
        height: 878px;
        width: 70%;
        bottom: 30px;
        left: 30px;
        border: 7px solid transparent;
        max-width: 92vw;
        max-height: min(90vh, calc(100% - 60px));
        z-index: 999999;
        transition: height 0.5s ease;
        outline: none;
      }
      .zf_lB_Wrapper_172856 {
        position: fixed;
        top: 50%;
        left: 50%;
        margin-left: 0;
        margin-top: -180px;
        z-index: 10000001;
      }
      .zf_main_id_172856 {
        height: calc(100% - 0px);
        display: flex;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      .zf_lb_closeform_172856 {
        position: absolute;
        right: -20px;
        background: #2f2e2e;
        padding: 0;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        top: -15px;
        cursor: pointer;
        border: 2px solid #d9d9d9;
      }
      .zf_lb_closeform_172856:before,
      .zf_lb_closeform_172856:after {
        position: absolute;
        left: 16px;
        content: " ";
        height: 19px;
        width: 2px;
        top: 7px;
        background-color: #f7f7f7;
      }
      .zf_lb_closeform_172856:before {
        transform: rotate(45deg);
      }
      .zf_lb_closeform_172856:after {
        transform: rotate(-45deg);
      }
      .fadeIn {
        animation-name: fadeIn;
        animation-duration: 1s;
        animation-fill-mode: both;
        display: block !important;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @media (max-width: 640px) {
        .zf_lB_Container_172856 {
          left: 16px;
          bottom: 16px;
          width: 92vw !important;
          height: auto;
        }
      }
      @media (max-width: 380px) {
        .zf_lB_Container_172856 {
          width: 90vw !important;
        }
      }
      @media (min-width: 500px) and (max-width: 600px) {
        .zf_lB_Container_172856 {
          width: 450px;
        }
      }
      @media (min-width: 601px) and (max-width: 700px) {
        .zf_lB_Container_172856 {
          width: 540px;
        }
      }
      @media (min-width: 700px) and (max-width: 800px) {
        .zf_lB_Container_172856 {
          width: 650px;
        }
      }
      @media (min-width: 801px) and (max-width: 1268px) {
        .zf_lB_Container_172856 {
          width: 750px !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fadeIn {
          animation: none;
        }
      }
    </style>

    <button id="zf_button_172856" style="display: none">Open</button>
    <script
      src="https://forms.zohopublic.eu/infotrop1/form/Newsletter/formperma/3Sqq3-MLnln4ANhFbTRGgs6rKG_M6XegeWhPuc1OEmg/litebox.js"
      defer
    ></script>
    <script>
      (function () {
        // Skip popup on checkout flows
        var EXCLUDE = [/\/order/i, /\/cart/i, /\/checkout/i, /\/payment/i];
        if (
          EXCLUDE.some(function (re) {
            return re.test(location.pathname);
          })
        )
          return;

        // Only show once per session; throttle for 30 days if dismissed
        var BTN_ID = "zf_button_172856";
        var isMobile = matchMedia("(max-width: 640px)").matches;
        var delay = isMobile ? 12000 : 7000;

        if (sessionStorage.getItem("nl_shown") === "1") return;

        var DAY = 86400000;
        var last = Number(localStorage.getItem("nl_last")) || 0;
        var dismissed = localStorage.getItem("nl_dismissed") === "1";
        if (dismissed && Date.now() - last < 30 * DAY) return;

        window.addEventListener("load", function () {
          setTimeout(function () {
            if (document.hidden) return;
            var btn = document.getElementById(BTN_ID);
            if (btn) {
              btn.click();
              sessionStorage.setItem("nl_shown", "1");
              localStorage.setItem("nl_last", String(Date.now()));
            }
          }, delay);
        });

        document.addEventListener("click", function (e) {
          if (e.target && e.target.closest(".zf_lb_closeform_172856")) {
            localStorage.setItem("nl_dismissed", "1");
            localStorage.setItem("nl_last", String(Date.now()));
          }
        });
      })();
    </script>
  </body>
</html>
