    <script>
      (function () {
        // Absolute URLs for share images (1200x630 preferred)
        const IMG = {

          africanFoods:
            "https://www.tropinord.com/images/share/african-foods.jpg",
        };

        // Map pathname → per-route meta
        const metaByPath = {
          "/nordic-harvest": {
            locale: "en_US",
            url: "https://www.tropinord.com/nordic-harvest",
            title: "Nordic Harvest – Harvest, breads & nature’s bounty",
            desc: "Rustic cornbread and a celebration of seasonal Nordic baking.",
            img: IMG.nordicHarvest,
          },
          "/sv/nordisk-skord": {
            locale: "sv_SE",
            url: "https://www.tropinord.com/sv/nordisk-skord",
            title: "NordSkörd – Skörd, bröd & naturens gåvor",
            desc: "Rustikt majsbröd och en hyllning till nordiska skördar.",
            img: IMG.nordicHarvest,
          },

          "/design": {
            locale: "en_US",
            url: "https://www.tropinord.com/design",
            title: "Design – Crafts, Paintings, Knitting & Textile",
            desc: "Artisan-made pieces inspired by Nordic motifs and natural fibers.",
            img: IMG.design,
          },
          "/sv/design": {
            locale: "sv_SE",
            url: "https://www.tropinord.com/sv/design",
            title: "Design – Hantverk, målningar, stickning & textil",
            desc: "Hantverksprodukter med nordiska mönster och naturmaterial.",
            img: IMG.design,
          },

          "/african-foods": {
            locale: "en_US",
            url: "https://www.tropinord.com/african-foods",
            title: "African Foods & Ingredients – Staples & flavors",
            desc: "Trusted staples like cassava fufu and pantry essentials.",
            img: IMG.africanFoods,
          },
          "/sv/afrikanska-livsmedel": {
            locale: "sv_SE",
            url: "https://www.tropinord.com/sv/afrikanska-livsmedel",
            title: "Afrikanska livsmedel & ingredienser – Råvaror & smaker",
            desc: "Basvaror som cassava fufu och andra skafferifavoriter.",
            img: IMG.africanFoods,
          },
        };

        const route = metaByPath[location.pathname];
        if (!route) return;

        // Utility to set or create a meta tag
        function setMeta(propertyOrName, content, isName = false) {
          if (!content) return;
          const selector = isName
            ? `meta[name="${propertyOrName}"]`
            : `meta[property="${propertyOrName}"]`;
          let el = document.querySelector(selector);
          if (!el) {
            el = document.createElement("meta");
            if (isName) el.setAttribute("name", propertyOrName);
            else el.setAttribute("property", propertyOrName);
            document.head.appendChild(el);
          }
          el.setAttribute("content", content);
        }

        // Apply Open Graph + Twitter
        setMeta("og:locale", route.locale);
        setMeta("og:title", route.title);
        setMeta("og:description", route.desc);
        setMeta("og:url", route.url);
        setMeta("og:image", route.img);
        setMeta("twitter:title", route.title, true);
        setMeta("twitter:description", route.desc, true);
        setMeta("twitter:image", route.img, true);

        // Keep document.title in sync (nice for copy/paste too)
        try {
          document.title = route.title + " | TropiNord";
        } catch {}
      })();
    </script>

    <script>
      (function () {
        const BTN_ID = "zf_button_172856";
        const EXCLUDE = [/\/order/i, /\/cart/i, /\/checkout/i, /\/payment/i];
        if (EXCLUDE.some((re) => re.test(location.pathname))) return;

        const isMobile = matchMedia("(max-width: 640px)").matches;
        const delay = isMobile ? 12000 : 7000;

        if (sessionStorage.getItem("nl_shown") === "1") return;

        const DAY = 86400000;
        const last = Number(localStorage.getItem("nl_last")) || 0;
        const dismissed = localStorage.getItem("nl_dismissed") === "1";
        if (dismissed && Date.now() - last < 30 * DAY) return;

        window.addEventListener("load", () => {
          setTimeout(() => {
            if (document.hidden) return;
            const btn = document.getElementById(BTN_ID);
            if (btn) {
              btn.click();
              sessionStorage.setItem("nl_shown", "1");
              localStorage.setItem("nl_last", String(Date.now()));
            }
          }, delay);
        });

        document.addEventListener("click", (e) => {
          if (e.target.closest(".zf_lb_closeform_172856")) {
            localStorage.setItem("nl_dismissed", "1");
            localStorage.setItem("nl_last", String(Date.now()));
          }
        });
      })();
    </script>
